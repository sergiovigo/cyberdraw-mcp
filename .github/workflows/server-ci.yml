name: Server CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/cyberdraw-runtime-contract/**'
      - 'packages/drawio-mcp-server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/cyberdraw-runtime-contract/**'
      - 'packages/drawio-mcp-server/**'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Audit development dependencies (diagnostic)
        if: always()
        continue-on-error: true
        run: pnpm audit --dev --audit-level=moderate

      - name: Audit all dependencies (diagnostic)
        if: always()
        continue-on-error: true
        run: pnpm run audit:dependencies

      - name: Dependency audit policy summary
        if: always()
        run: |
          {
            echo "## Dependency audit policy"
            echo
            echo "- Production dependency audit is blocking: \`pnpm audit --prod --audit-level=moderate\`."
            echo "- Development dependency audit is diagnostic and temporarily non-blocking: \`pnpm audit --dev --audit-level=moderate\`."
            echo "- Full dependency audit remains visible as diagnostic output: \`pnpm run audit:dependencies\`."
            echo "- Tracked development advisory: GHSA-mh99-v99m-4gvg in \`brace-expansion\`."
            echo "- The current vulnerable path is dev/test tooling through Jest, Istanbul, glob, minimatch, and rimraf."
            echo "- No compatible upstream remediation is currently available without forcing incompatible transitive majors."
            echo "- Revisit this policy when Jest, Istanbul, glob, or minimatch provide a compatible dependency path."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cache draw.io assets
        uses: actions/cache@v5
        with:
          path: ~/.cache/drawio-mcp-server
          key: drawio-assets-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/drawio-mcp-server

      - name: Build server for asset prefetch
        run: pnpm --filter drawio-mcp-server... run build

      - name: Prefetch draw.io assets
        run: pnpm run prefetch-assets
        working-directory: packages/drawio-mcp-server

      - name: Check types
        run: pnpm --filter drawio-mcp-server run lint

      - name: Run linter
        run: |
          pnpm run lint
          pnpm run format:check
        working-directory: packages/drawio-mcp-server

      - name: Run tests
        run: pnpm test
        working-directory: packages/drawio-mcp-server
